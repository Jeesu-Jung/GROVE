version: '3.8'

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  redis:
    image: redis:7-alpine
    container_name: grove-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - grove-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: grove-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - grove-network

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: grove-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - grove-network

  milvus:
    image: milvusdb/milvus:v2.6.2
    container_name: grove-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - grove-network

  # ============================================
  # One-shot Embedding Indexer (optional)
  # ============================================

  grove-task-mixture-embed:
    build:
      context: ./grove-task-mixture-embed
      dockerfile: Dockerfile
    container_name: grove-task-mixture-embed
    profiles: ["embed"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_KEY_INLINE=${OPENAI_API_KEY_INLINE:-}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_HEALTH_URL=http://milvus:9091/healthz
      - MILVUS_WAIT_SECONDS=${MILVUS_WAIT_SECONDS:-240}
      - SEED_SENTENCE_COLLECTION=seed_sentence
      - INSTRUCTION_ALPACA_COLLECTION=instruction_alpaca
    depends_on:
      milvus:
        condition: service_healthy
    restart: "no"
    networks:
      - grove-network

  # ============================================
  # Backend Services
  # ============================================

  grove-cache-service:
    build:
      context: ./grove-cache-service
      dockerfile: Dockerfile
    container_name: grove-cache-service
    ports:
      - "${CACHE_SERVICE_PORT:-8080}:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - grove-network

  grove-task-mixture-service:
    build:
      context: ./grove-task-mixture-service
      dockerfile: Dockerfile
    container_name: grove-task-mixture-service
    ports:
      - "${TASK_MIXTURE_PORT:-8081}:8081"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - grove-network

  grove-zebra-service:
    build:
      context: ./grove-zebra-service
      dockerfile: Dockerfile
    container_name: grove-zebra-service
    ports:
      - "${ZEBRA_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - grove-network

  grove-model-centric-service:
    build:
      context: ./grove-model-centric-service
      dockerfile: Dockerfile
    container_name: grove-model-centric-service
    ports:
      - "${MODEL_CENTRIC_PORT:-8083}:8083"
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_DIR=/app/model/Llama-3.2-1B-Instruct
    volumes:
      - ${MODEL_PATH:-./grove-model-centric-service/model}:/app/model:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - grove-network

  weavy:
    build:
      context: ./weavy
      dockerfile: Dockerfile
    container_name: grove-weavy
    ports:
      - "${WEAVY_PORT:-8084}:8084"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MILVUS_URI=http://milvus:19530
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-weavy_test}
      - MILVUS_DIMENSION=${MILVUS_DIMENSION:-1536}
    depends_on:
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - grove-network

  # ============================================
  # Frontend
  # ============================================

  grove-frontend:
    build:
      context: ./grove-frontend
      dockerfile: Dockerfile
    container_name: grove-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - grove-cache-service
      - grove-task-mixture-service
      - grove-zebra-service
      - grove-model-centric-service
      - weavy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - grove-network

# ============================================
# Networks
# ============================================

networks:
  grove-network:
    driver: bridge

# ============================================
# Volumes
# ============================================

volumes:
  redis-data:
    driver: local
  etcd-data:
    driver: local
  minio-data:
    driver: local
  milvus-data:
    driver: local
