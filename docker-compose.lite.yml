version: '3.8'

# Lite version without Milvus (vector search disabled)
# This excludes: etcd, minio, milvus, task-mixture-service, weavy
# Services included: redis, cache-service, zebra-service, model-centric-service, frontend

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  redis:
    image: redis:7-alpine
    container_name: grove-redis-lite
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - grove-network-lite

  # ============================================
  # Backend Services
  # ============================================

  grove-cache-service:
    build:
      context: ./grove-cache-service
      dockerfile: Dockerfile
    container_name: grove-cache-service-lite
    ports:
      - "${CACHE_SERVICE_PORT:-8080}:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - grove-network-lite

  grove-zebra-service:
    build:
      context: ./grove-zebra-service
      dockerfile: Dockerfile
    container_name: grove-zebra-service-lite
    ports:
      - "${ZEBRA_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - grove-network-lite

  grove-model-centric-service:
    build:
      context: ./grove-model-centric-service
      dockerfile: Dockerfile
    container_name: grove-model-centric-service-lite
    ports:
      - "${MODEL_CENTRIC_PORT:-8083}:8083"
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ${MODEL_PATH:-./grove-model-centric-service/model}:/app/model:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - grove-network-lite

  # ============================================
  # Frontend (with limited features)
  # ============================================

  grove-frontend:
    build:
      context: ./grove-frontend
      dockerfile: Dockerfile
    container_name: grove-frontend-lite
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - grove-cache-service
      - grove-zebra-service
      - grove-model-centric-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - grove-network-lite

# ============================================
# Networks
# ============================================

networks:
  grove-network-lite:
    driver: bridge

# ============================================
# Volumes
# ============================================

volumes:
  redis-data:
    driver: local
